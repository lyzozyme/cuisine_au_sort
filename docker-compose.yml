services:
  db:
    image: postgres:17-alpine
    container_name: cuisineausort-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuisineausort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuisineausort}
      POSTGRES_DB: ${POSTGRES_DB:-cuisineausort}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés uniquement à la première initialisation du volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
